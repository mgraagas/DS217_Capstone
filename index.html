<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ER Visits Declined as BUCAS Utilization Increased in 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:   #2B6CB0;
    --blue-m: rgba(43,108,176,0.52);
    --blue-f: rgba(43,108,176,0.11);
    --red:    #C53030;
    --red-m:  rgba(197,48,48,0.52);
    --red-f:  rgba(197,48,48,0.11);
    --green:  #276749;
    --bg:     #F9F7F4;
    --card:   #FFFFFF;
    --border: rgba(0,0,0,0.08);
    --text:   #1A202C;
    --muted:  #718096;
    --light:  #A0AEC0;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 3rem 2rem 5rem;
  }

  .page { max-width: 920px; margin: 0 auto; }

  .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  header { margin-bottom: 2rem; }

  header h1 {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  header p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.65;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }

  .chart-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }

  .toggle-group { display: flex; gap: 8px; }

  .toggle-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 18px;
    border-radius: 100px;
    border: 1.5px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s;
  }

  .toggle-btn .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .er-btn  { background:rgba(43,108,176,0.08); border-color:rgba(43,108,176,0.25); color:var(--blue); }
  .er-btn.active  { background:var(--blue); border-color:var(--blue); color:#fff; }
  .bk-btn  { background:rgba(197,48,48,0.08); border-color:rgba(197,48,48,0.25); color:var(--red); }
  .bk-btn.active  { background:var(--red); border-color:var(--red); color:#fff; }

  .legend-row {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .legend-row span { display: flex; align-items: center; gap: 5px; }

  .leg-sq {
    width: 10px; height: 10px;
    border-radius: 2px;
    display: inline-block;
    flex-shrink: 0;
  }

  #hover-callout {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 38px;
    padding: 0 14px;
    margin-bottom: 12px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 12px;
    visibility: hidden;
    overflow: hidden;
  }

  #hc-name { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  #hc-y24, #hc-y25, #hc-chg { white-space:nowrap; flex-shrink:0; }

  .chart-wrap { position: relative; width: 100%; height: 590px; }

  footer {
    margin-top: 2.5rem;
    font-size: 11px;
    color: var(--light);
    text-align: center;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="eyebrow">DOH Hospital Utilization · 2024–2025</p>
    <h1>ER Visits Declined as BUCAS Utilization<br>Increased in 2025</h1>
    <p>Comparison of 2024 and 2025 visits per DOH hospital.</p>
  </header>

  <div class="chart-card">
    <div class="chart-top">
      <div class="toggle-group">
        <button class="toggle-btn er-btn active" id="btn-er" onclick="switchView('er')">
          <span class="dot" style="background:currentColor;"></span>ER visits
        </button>
        <button class="toggle-btn bk-btn" id="btn-bk" onclick="switchView('bk')">
          <span class="dot" style="background:currentColor;"></span>BUCAS visits
        </button>
      </div>
      <div class="legend-row">
        <span><span class="leg-sq" id="leg-24"></span><span id="leg-24-lbl"></span></span>
        <span><span class="leg-sq" id="leg-25"></span><span id="leg-25-lbl"></span></span>
      </div>
    </div>

    <div id="hover-callout">
      <span id="hc-name"></span>
      <span id="hc-y24"></span>
      <span id="hc-y25"></span>
      <span id="hc-chg"></span>
    </div>

    <div class="chart-wrap">
      <canvas id="drillChart" role="img" aria-label="Grouped horizontal bar chart showing 2024 and 2025 ER or BUCAS visits per DOH hospital."></canvas>
    </div>
  </div>

  <footer>Source: Department of Health Philippines &nbsp;·&nbsp; Emergency Room &amp; BUCAS Center Utilization Data 2024–2025</footer>
</div>

<script>
const HOSPITALS = [
  { name:"Batangas MC",            v24:53381,  v25:47814,  b24:7569,   b25:14190  },
  { name:"Cagayan Valley MC",      v24:52906,  v25:56570,  b24:3135,   b25:27896  },
  { name:"Conner DH",              v24:10559,  v25:11326,  b24:700,    b25:1492   },
  { name:"Davao Occidental GH",    v24:6696,   v25:8089,   b24:4681,   b25:9645   },
  { name:"Davao Regional MC",      v24:62459,  v25:50139,  b24:31427,  b25:78070  },
  { name:"Dr. Jose N. Rodriguez",  v24:119758, v25:112694, b24:18497,  b25:23327  },
  { name:"Dr. Paulino Garcia MRC", v24:69075,  v25:65819,  b24:4660,   b25:24181  },
  { name:"Eastern Visayas MC",     v24:41469,  v25:34240,  b24:8200,   b25:15396  },
  { name:"Far North Luzon GH",     v24:18730,  v25:19387,  b24:752,    b25:3077   },
  { name:"Ilocos Training & RMC",  v24:78377,  v25:70237,  b24:21694,  b25:68387  },
  { name:"Jose B. Lingad MGH",     v24:118491, v25:124688, b24:50301,  b25:137907 },
  { name:"Luis Hora MRH",          v24:11598,  v25:11044,  b24:1300,   b25:2044   },
  { name:"Mariano Marcos MH",      v24:38720,  v25:46673,  b24:2440,   b25:2355   },
  { name:"Quirino MMC",            v24:87951,  v25:89970,  b24:172,    b25:1391   },
  { name:"Siargao Island MC",      v24:12140,  v25:13264,  b24:38,     b25:1829   },
  { name:"Southern Isabela MC",    v24:19059,  v25:24125,  b24:9865,   b25:24804  },
  { name:"Southern Tagalog RH",    v24:32113,  v25:29711,  b24:1469,   b25:10645  },
  { name:"Zamboanga City MC",      v24:70454,  v25:70314,  b24:486,    b25:3086   },
];

const BLUE   = '#2B6CB0';
const BLUE_M = 'rgba(43,108,176,0.52)';
const BLUE_F = 'rgba(43,108,176,0.11)';
const RED    = '#C53030';
const RED_M  = 'rgba(197,48,48,0.52)';
const RED_F  = 'rgba(197,48,48,0.11)';
const GREEN  = '#276749';
const gc     = 'rgba(0,0,0,0.06)';
const lc     = '#718096';

let currentView = 'er';
let activeHoverIdx = null;
let chart = null;

function getColors(n, hi, full, fade) {
  return Array.from({length: n}, (_, i) => hi === null ? full : i === hi ? full : fade);
}

function buildChart(view) {
  const isER  = view === 'er';
  const FULL  = isER ? BLUE   : RED;
  const MID   = isER ? BLUE_M : RED_M;
  const FADE  = isER ? BLUE_F : RED_F;

  const sorted = [...HOSPITALS].sort((a, b) => isER ? b.v24 - a.v24 : b.b24 - a.b24);

  document.getElementById('leg-24').style.background = MID;
  document.getElementById('leg-25').style.background = FULL;
  document.getElementById('leg-24-lbl').textContent  = isER ? '2024 ER visits'    : '2024 BUCAS visits';
  document.getElementById('leg-25-lbl').textContent  = isER ? '2025 ER visits'    : '2025 BUCAS visits';
  document.getElementById('btn-er').className = 'toggle-btn er-btn' + (isER  ? ' active' : '');
  document.getElementById('btn-bk').className = 'toggle-btn bk-btn' + (!isER ? ' active' : '');

  if (chart) { chart.destroy(); chart = null; }
  activeHoverIdx = null;
  document.getElementById('hover-callout').style.visibility = 'hidden';

  const drillLabelPlugin = {
    id: 'dl',
    afterDatasetsDraw(ch) {
      const { ctx } = ch;
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ch.data.datasets.forEach((_, di) => {
        ch.getDatasetMeta(di).data.forEach((bar, i) => {
          const val = ch.data.datasets[di].data[i];
          const isH = activeHoverIdx === i;
          ctx.font      = isH ? "600 10px 'DM Sans',sans-serif" : "400 10px 'DM Sans',sans-serif";
          ctx.fillStyle = isH ? '#1A202C' : 'rgba(0,0,0,0.32)';
          ctx.fillText(val.toLocaleString(), bar.x + 5, bar.y);
        });
      });
      ctx.restore();
    }
  };

  chart = new Chart(document.getElementById('drillChart'), {
    type: 'bar',
    plugins: [drillLabelPlugin],
    data: {
      labels: sorted.map(h => h.name),
      datasets: [
        { label: '2024', data: sorted.map(h => isER ? h.v24 : h.b24), backgroundColor: getColors(18, null, MID,  FADE), borderRadius: 2 },
        { label: '2025', data: sorted.map(h => isER ? h.v25 : h.b25), backgroundColor: getColors(18, null, FULL, FADE), borderRadius: 2 }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 500, easing: 'easeOutQuart' },
      layout: { padding: { right: 108 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          ticks: { color: lc, font: { size: 11, family: "'DM Sans',sans-serif" }, callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v },
          grid: { color: gc }
        },
        y: {
          ticks: { color: lc, font: { size: 11, family: "'DM Sans',sans-serif" } },
          grid: { color: gc }
        }
      },
      onHover: (e, els) => {
        document.getElementById('drillChart').style.cursor = els.length ? 'pointer' : 'default';
      }
    }
  });

  const dc = document.getElementById('drillChart');

  dc.onmousemove = evt => {
    const els = chart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, false);
    if (!els.length) {
      if (activeHoverIdx !== null) {
        activeHoverIdx = null;
        chart.data.datasets[0].backgroundColor = getColors(18, null, MID,  FADE);
        chart.data.datasets[1].backgroundColor = getColors(18, null, FULL, FADE);
        chart.update('none');
        document.getElementById('hover-callout').style.visibility = 'hidden';
      }
      return;
    }
    const i = els[0].index;
    if (i === activeHoverIdx) return;
    activeHoverIdx = i;

    chart.data.datasets[0].backgroundColor = getColors(18, i, FULL, FADE);
    chart.data.datasets[1].backgroundColor = getColors(18, i, FULL, FADE);
    chart.update('none');

    const h    = sorted[i];
    const y24  = isER ? h.v24 : h.b24;
    const y25  = isER ? h.v25 : h.b25;
    const diff = y25 - y24;
    const chg  = y24 > 0 ? ((diff / y24) * 100).toFixed(1) : null;
    const chgCol = chg && parseFloat(chg) < 0 ? RED : GREEN;
    const arr    = chg ? parseFloat(chg) >= 0 ? '▲' : '▼' : '';

    document.getElementById('hc-name').textContent = h.name;
    document.getElementById('hc-name').style.color  = FULL;
    document.getElementById('hc-y24').textContent   = `2024: ${y24.toLocaleString()}`;
    document.getElementById('hc-y24').style.color   = lc;
    document.getElementById('hc-y25').textContent   = `2025: ${y25.toLocaleString()}`;
    document.getElementById('hc-y25').style.color   = lc;
    document.getElementById('hc-chg').textContent   = chg ? `${arr}${Math.abs(chg)}% (${diff > 0 ? '+' : ''}${diff.toLocaleString()})` : '';
    document.getElementById('hc-chg').style.color   = chgCol;
    document.getElementById('hover-callout').style.visibility = 'visible';
  };

  dc.onmouseleave = () => {
    activeHoverIdx = null;
    chart.data.datasets[0].backgroundColor = getColors(18, null, MID,  FADE);
    chart.data.datasets[1].backgroundColor = getColors(18, null, FULL, FADE);
    chart.update('none');
    document.getElementById('hover-callout').style.visibility = 'hidden';
  };
}

function switchView(view) {
  if (view === currentView) return;
  currentView = view;
  buildChart(view);
}

buildChart('er');
</script>
</body>
</html>
